<!DOCTYPE html>
<html>
<head>
    <title>Random Forest Predictor</title>
</head>
<body>

    <h1>Random Forest Prediction System</h1>

    <input type="number" step="0.1" id="f1" placeholder="Sepal Length">
    <input type="number" step="0.1" id="f2" placeholder="Sepal Width">
    <input type="number" step="0.1" id="f3" placeholder="Petal Length">
    <input type="number" step="0.1" id="f4" placeholder="Petal Width">

    <button onclick="predict()">Predict</button>

    <h2 id="result"></h2>

    <script>
        async function predict() {
            const f1 = parseFloat(document.getElementById("f1").value);
            const f2 = parseFloat(document.getElementById("f2").value);
            const f3 = parseFloat(document.getElementById("f3").value);
            const f4 = parseFloat(document.getElementById("f4").value);

            if ([f1, f2, f3, f4].some(isNaN)) {
                document.getElementById("result").innerHTML =
                    "Please enter all four values.";
                return;
            }

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        features: [f1, f2, f3, f4]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById("result").innerHTML =
                        "Error: " + data.error;
                } else {
                    document.getElementById("result").innerHTML =
                        "Prediction: " + data.prediction;
                }

            } catch (error) {
                document.getElementById("result").innerHTML =
                    "Request failed: " + error.message;
            }
        }
    </script>

</body>
</html>
